# HTTP redirect to HTTPS
server {
    listen 80;
    server_name wemurz.com www.wemurz.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration for wemurz.com
server {
    listen 443 ssl;
    server_name wemurz.com www.wemurz.com;

    # SSL Certificates (managed by Certbot usually)
    ssl_certificate /etc/letsencrypt/live/wemurz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wemurz.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Route /api/ to backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route everything else to frontend
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}




