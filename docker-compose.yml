version: "3.8"

services:
  backend:
    image: programmingprobhet/wemurz-backend:v1
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    container_name: wemurz_backend
    restart: unless-stopped
    env_file:
      # - ./server/.env
      - .env
    # To persist uploads
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - app-network

  frontend:
    image: programmingprobhet/wemurz-frontend:v1
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: wemurz_frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: wemurz_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Change dev.conf to prod.conf for production deployment
      # - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

      # For production with SSL uncomment these mounts:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

